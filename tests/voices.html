<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Test de voces</title>
<style>
  body { background:#08080a; color:#cfc9bd; font:12px Consolas, monospace; padding:16px; }
  canvas { background:#000; border:1px solid #222; margin:4px 8px 12px 0; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<h3>Voces 909 + bajo (render offline)</h3>
<pre id="out">ejecutando…</pre>
<div id="plots"></div>
<script src="../js/core.js"></script>
<script src="../js/synth.js"></script>
<script>
(async function () {
  const sr = 48000, dur = 2.0;
  const out = document.getElementById('out'), plots = document.getElementById('plots');
  const lines = [];

  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
        for (let j = 0; j < len / 2; j++) {
          const ur = re[i + j], ui = im[i + j];
          const vr = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci, vi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
          re[i + j] = ur + vr; im[i + j] = ui + vi; re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } }
  }

  async function renderVoice(name, fn) {
    const ctx = new OfflineAudioContext(1, sr * dur, sr);
    const env = NRB.Synth.makeEnv(ctx);
    const out = ctx.createGain(); out.connect(ctx.destination);
    fn(env, out, 0.05);
    const buf = await ctx.startRendering();
    const d = buf.getChannelData(0);
    let pk = 0, e = 0;
    for (let i = 0; i < d.length; i++) { pk = Math.max(pk, Math.abs(d[i])); }
    const n500 = Math.round(0.5 * sr);
    for (let i = Math.round(0.05 * sr); i < Math.round(0.05 * sr) + n500; i++) e += d[i] * d[i];
    const rms = Math.sqrt(e / n500);
    // decaimiento: tiempo hasta caer 40 dB desde el pico (ventana de 5 ms)
    const w = Math.round(0.005 * sr); let peakEnv = 0; const env5 = [];
    for (let i = 0; i + w < d.length; i += w) { let m = 0; for (let j = 0; j < w; j++) m = Math.max(m, Math.abs(d[i + j])); env5.push(m); peakEnv = Math.max(peakEnv, m); }
    let t40 = 0; const pi = env5.indexOf(peakEnv);
    for (let i = pi; i < env5.length; i++) if (env5[i] < peakEnv * 0.01) { t40 = (i - pi) * w / sr; break; }
    // centroide espectral (ventana de 8192 desde el ataque)
    const N = 8192, re = new Float64Array(N), im = new Float64Array(N), s0 = Math.round(0.05 * sr);
    for (let i = 0; i < N; i++) re[i] = d[s0 + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
    fft(re, im);
    let num = 0, den = 0, maxK = 0, maxV = 0;
    for (let k = 1; k < N / 2; k++) { const m = Math.hypot(re[k], im[k]); num += m * k * sr / N; den += m; if (m > maxV) { maxV = m; maxK = k; } }
    lines.push(name.padEnd(8) + ' peak ' + pk.toFixed(2).padStart(5) + '  rms500ms ' + (20 * Math.log10(rms + 1e-9)).toFixed(1).padStart(6) + ' dB  -40dB@ ' + (t40 * 1000).toFixed(0).padStart(4) + ' ms  centroid ' + Math.round(num / den).toString().padStart(5) + ' Hz  peakFreq ' + Math.round(maxK * sr / N) + ' Hz');
    // gráficos
    const c1 = document.createElement('canvas'); c1.width = 420; c1.height = 90; const g = c1.getContext('2d');
    g.strokeStyle = '#ffa23a'; g.beginPath();
    for (let x = 0; x < 420; x++) { const a = Math.floor(x / 420 * sr * 0.6); let mn = 1, mx = -1; for (let j = 0; j < 100; j++) { const v = d[a + j * 10] || 0; mn = Math.min(mn, v); mx = Math.max(mx, v); } g.moveTo(x, 45 - mx * 44); g.lineTo(x, 45 - mn * 44); }
    g.stroke(); g.fillStyle = '#888'; g.fillText(name + ' · 0–600 ms', 4, 11);
    const c2 = document.createElement('canvas'); c2.width = 420; c2.height = 90; const g2 = c2.getContext('2d');
    g2.strokeStyle = '#6d9bb5'; g2.beginPath();
    for (let x = 0; x < 420; x++) { const f0 = 30 * Math.pow(22000 / 30, x / 420), f1 = 30 * Math.pow(22000 / 30, (x + 1) / 420); let m = 0; for (let k = Math.floor(f0 * N / sr); k <= Math.max(Math.floor(f0 * N / sr), Math.floor(f1 * N / sr)); k++) m = Math.max(m, Math.hypot(re[k] || 0, im[k] || 0)); const db = 20 * Math.log10(m + 1e-9); const y = 88 - Math.max(0, Math.min(1, (db + 20) / 100)) * 86; x ? g2.lineTo(x, y) : g2.moveTo(x, y); }
    g2.stroke(); g2.fillStyle = '#888'; g2.fillText('espectro 30 Hz–22 kHz', 4, 11);
    plots.append(c1, c2, document.createElement('br'));
  }

  const v1 = { pitch: 1, decay: 1 };
  await renderVoice('kick', (e, o, t) => NRB.Synth.kick(e, o, t, 1, v1));
  await renderVoice('clap', (e, o, t) => NRB.Synth.clap(e, o, t, 1, v1));
  await renderVoice('snare', (e, o, t) => NRB.Synth.snare(e, o, t, 1, v1));
  await renderVoice('hat', (e, o, t) => NRB.Synth.hat(e, o, t, 1, v1));
  await renderVoice('ohat', (e, o, t) => NRB.Synth.ohat(e, o, t, 1, v1));
  await renderVoice('bass A1', (e, o, t) => NRB.Synth.bass(e, o, t, 0.25, 33, 1, v1));
  await renderVoice('bass C2', (e, o, t) => NRB.Synth.bass(e, o, t, 0.25, 36, 1, v1));
  out.textContent = lines.join('\n');
  window.__done = true;
})().catch((err) => { document.getElementById('out').textContent = 'ERROR: ' + (err && err.stack || err); });
</script>
</body>
</html>
